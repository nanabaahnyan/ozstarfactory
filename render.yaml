services:
  - type: web
    name: ozstarfactory-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn ozstar_core.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: api.ozstarfactory.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ozstarfactory.com,https://www.ozstarfactory.com
      - key: MAINTENANCE_MODE
        value: "True"
      - key: MAINTENANCE_MESSAGE
        sync: false
      - key: MAINTENANCE_ETA
        sync: false
